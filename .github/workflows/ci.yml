name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm's version comes from "packageManager" in package.json; naming it here too fails the setup.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Advisories listed in package.json (pnpm.auditConfig.ignoreGhsas) reach only the mobile app's Expo dev
      # tooling and have no patched release yet. Drop them once fixes ship.
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
